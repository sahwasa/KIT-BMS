<dialog id="p_attendanceLocation" class="p_attendance_location">
  <form method="dialog">
    <header class="p_header">
      <strong>위치현황</strong>
      <button class="btnClose ico_org cancel" aria-label="close">닫기</button>
    </header>
    <div class="p_body">
      <section class="map-top">
        <ul class="search_list">
          <li>
            <input type="date" min="0000-01-01" max="9999-12-31" id="" title="휴가시작" onchange="setPeriod()" />
          </li>       
          <li>
            <input type="text" id="" placeholder="사원명 검색" list="nameList" autocomplete="off">
            <datalist id="nameList">
              <optgroup label="개발본부">
                <option value="대장발핑">개발본부</option>
                <option value="개발핑">개발 1팀</option>
                <option value="새발핑">개발 1팀</option>
                <option value="말발핑">개발 2팀</option>
                <option value="소발핑">개발 2팀</option>
                <option value="곰발핑">개발 2팀</option>
              </optgroup>
              <optgroup label="경영관리">
                <option value="경영핑">경영관리</option>
                <option value="관리핑">경영관리</option>
              </optgroup>                  
            </datalist>
            </li>
            <li>
              <button type="button" class="btn_search">검색</button>
            </li>
          </ul>                   
        <div class="tool legend-wrap">
        <!-- $cal-status: (
          'clockin': #185FA5,
          'clockout': #BA7517,
          'cluster': #534AB7,
        ); -->
          <ul class="legend-location">
            <li class="is-clockin">출근</li>
            <li class="is-clockout">퇴근</li>
            <li class="is-cluster">클러스터</li>
          </ul>      
        </div>
      </section>
      <div class="map-wrap" id="mapWrap" style="background: url(../../images/temp/temp_map.jpg) 50% / cover;">
        <!-- 마커 컨테이너 -->
        <div id="" class="maker-container" >
          <div class="maker checkin" style="left: 461.5px; top: 198.648px;">
            <strong>하츄핑</strong><span>09:40</span>
          </div>
          <div class="maker checkout" style="left: 520.1px; top: 233.1px;">
            <strong>하츄핑</strong><span>20:10</span>
          </div> 
          <div class="cluster" style="left: 575px; top: 111px;">2</div>       
        </div>
        <div class="tooltip" style="left: 606.9px; top: 86.937px;">
          <div class="tooltip-name">총 2건</div>
          <div class="tooltip-meta" style="margin-bottom:6px;">출근 1건 · 퇴근 1건</div>
          <hr class="tooltip-divider"><div class="tooltip-row"><div class="tooltip-dot" style="background:#185FA5;"></div>하츄핑 · 출근 09:02</div><div class="tooltip-row"><div class="tooltip-dot" style="background:#BA7517;"></div>하츄핑 · 퇴근 18:15</div>
        </div>
        <!-- 줌 컨트롤 -->
        <div class="zoom-ctrl">
          <button type="button" class="zoom-btn" id="zoomIn">+</button>
          <button type="button" class="zoom-btn" id="zoomOut">−</button>
        </div>
      </div>
    </div>
  </form>
</dialog>
